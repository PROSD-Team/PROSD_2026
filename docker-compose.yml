version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: prosd_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: prosd_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: prosd_minio
    restart: always
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" 
      - "9001:9001" 
    volumes:
      - minio_data:/data

  backend:
    image: prosd_backend
    container_name: prosd_backend
    build:
      context: ./PROSD.backend.net
      dockerfile: PROSD.backend.net/Dockerfile 
    restart: always
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=prosd_db;Username=admin;Password=password123;
      - Minio__Endpoint=minio:9000
      - Minio__AccessKey=admin
      - Minio__SecretKey=password123
      - Minio__UseSSL=false
    depends_on:
      - postgres
      - minio
volumes:
  postgres_data:
  minio_data: