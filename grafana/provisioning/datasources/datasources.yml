apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "15s"
      queryTimeout: "60s"
      httpMethod: POST
    version: 1

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 1000
      # derivedFields commented out — Tempo not yet configured
      # Uncomment and configure when Tempo is added:
      # derivedFields:
      #   - datasourceUid: tempo
      #     matcherRegex: "trace_id=(\\w+)"
      #     name: TraceID
      #     url: "${__value.raw}"
    version: 1

  # Optional: Add Tempo when implementing distributed tracing
  # - name: Tempo
  #   uid: tempo
  #   type: tempo
  #   access: proxy
  #   url: http://tempo:3200
  #   editable: true
  #   jsonData:
  #     tracesToLogsV2:
  #       datasourceUid: loki
  #       filterByTraceID: true
  #       tags: ['job', 'instance']
  #   version: 1